services:
  redis:
    image: redis:8-alpine
    ports:
      - "6379:6379"
  # install postgresql image latest and lightweight
  postgres:
    image: postgres:18-alpine
    container_name: myapp-postgres
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: test
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "app"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
